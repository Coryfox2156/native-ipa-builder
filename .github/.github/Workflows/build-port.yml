name: Build Native iOS IPA

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'Direct Google Drive Download URL for your game (.nsp)'
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout nxnative Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          brew install xcodegen zstd glslang
          brew install --cask dotnet-sdk

      - name: Set Up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Build Dependencies
        run: |
          python3 -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic backports.zstd

      - name: Inject Production Keys
        run: |
          mkdir -p ~/.keys
          echo "${{ secrets.PROD_KEYS }}" > ~/.keys/prod.keys

      - name: Download Game File from Cloud
        run: |
          mkdir -p ~/Games/TargetGame
          curl -L "${{ github.event.inputs.game_url }}" -o ~/Games/TargetGame/game.nsp

      - name: Execute nxnative Binary Compilation
        run: |
          python3 scripts/build_ipa_from_nsp.py ~/Games/TargetGame -k ~/.keys/prod.keys

      - name: Upload Finished IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Native-iOS-Game-Port
          path: ./*.ipa
